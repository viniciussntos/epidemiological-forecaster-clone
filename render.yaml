services:
  - type: web
    name: epidemiological-forecaster-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: EVALUATION_LAG_WEEKS
        value: "4"
      - key: API_CACHE_TTL_SECONDS
        value: "300"
      - key: DATABASE_URL
        sync: false
